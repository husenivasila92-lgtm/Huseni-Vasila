name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          mkdir app
          unzip -q huseni_vasila_contractor_flutter.zip -d app
          echo "Searching for pubspec.yaml..."
          find app -name pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find app -name pubspec.yaml | head -1)")
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huseni-vasila-contractor-apk
          path: app/**/build/app/outputs/flutter-apk/app-release.apk
